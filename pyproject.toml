[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "proyecto-similitud"
version = "0.1.0"
description = "Buscador de canciones similares por embeddings de audio (uso personal)"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "pydub>=0.25.1",
    "click>=8.1.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
similitud = "proyecto_similitud.main:cli"

[tool.setuptools.packages.find]
include = ["proyecto_similitud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
